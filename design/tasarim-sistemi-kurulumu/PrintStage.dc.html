<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:relative;width:100%;height:100%;background:var(--bg-base,#0B0B0B);overflow:hidden;display:flex;align-items:flex-end;justify-content:center">
  <div style="position:absolute;inset:0;background-image:linear-gradient(var(--border,var(--border,#2A2A2A)) 1px,transparent 1px),linear-gradient(90deg,var(--border,var(--border,#2A2A2A)) 1px,transparent 1px);background-size:48px 48px;opacity:.6"></div>
  <div style="position:relative;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:2px;width:100%;padding:0 0 74px">
    <sc-for list="{{ bars }}" as="b" hint-placeholder-count="26">
      <div style="{{ b.style }}"></div>
    </sc-for>
  </div>
  <div style="position:absolute;left:12%;right:12%;bottom:66px;height:6px;background:var(--border-strong,#3F4441);border-radius:2px"></div>
  <div style="position:absolute;left:6%;right:6%;bottom:56px;height:10px;background:linear-gradient(var(--bg-raised,#171717),var(--bg-base,#0B0B0B));border-top:1px solid var(--border,#2A2A2A)"></div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:420,&quot;height&quot;:560},&quot;progress&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:0.72,&quot;min&quot;:0,&quot;max&quot;:1,&quot;step&quot;:0.01,&quot;tsType&quot;:&quot;number&quot;},&quot;layers&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:40,&quot;min&quot;:8,&quot;max&quot;:80,&quot;tsType&quot;:&quot;number&quot;},&quot;color&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;var(--text-secondary,#C9CCC6)&quot;,&quot;options&quot;:[&quot;var(--text-secondary,#C9CCC6)&quot;,&quot;var(--gold,#EBB60E)&quot;,&quot;var(--border-strong,#3F4441)&quot;,&quot;#FFFFFF&quot;],&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const n = Number(this.props.layers ?? 40);
    const p = Number(this.props.progress ?? 0.72);
    const col = this.props.color ?? "var(--text-secondary,#C9CCC6)";
    const bars = [];
    for (let i = n - 1; i >= 0; i--) {
      const t = i / (n - 1);
      const w = 16 + 26 * Math.sin(Math.PI * (0.18 + t * 0.72));
      const printed = t <= p;
      const cur = Math.abs(t - p) < 0.5 / n;
      bars.push({ style: { width: w + "%", height: cur ? "3px" : "6px", background: cur ? "var(--gold,#EBB60E)" : printed ? col : "var(--bg-raised,#171717)", borderRadius: "1px" } });
    }
    return { bars };
  }
}

</script>
</body>
</html>
