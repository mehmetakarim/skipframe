[workspace]
resolver = "2"
members = ["crates/skipframe-gcode", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
repository = "https://github.com/mehmetakarim/skipframe"
authors = ["SkipFrame contributors"]

[workspace.dependencies]
skipframe-gcode = { path = "crates/skipframe-gcode" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
memchr = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

# The parser benchmark must be measured on optimised code even in a dev build.
[profile.dev.package.skipframe-gcode]
opt-level = 3
